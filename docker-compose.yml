version: '3.8'

services:
  whisper-app:
    build: .
    container_name: office-agent
    ports:
      - "5001:5001"
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-gpt-4o-mini-transcribe}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-jhgan/ko-sroberta-multitask}
      ACCESS_CODE: ${ACCESS_CODE:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-3600}
      MAX_AUDIO_UPLOAD_MB: ${MAX_AUDIO_UPLOAD_MB:-25}
      MAX_DOCUMENT_UPLOAD_MB: ${MAX_DOCUMENT_UPLOAD_MB:-10}
      MAX_SUMMARY_DOCUMENTS: ${MAX_SUMMARY_DOCUMENTS:-5}
      CHROMA_URL: ${CHROMA_URL:-http://host.docker.internal:9001}
      CHROMA_TENANT: ${CHROMA_TENANT:-default_tenant}
      CHROMA_DATABASE: ${CHROMA_DATABASE:-default_database}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-office_agent_documents}
      CHROMA_TIMEOUT_SECONDS: ${CHROMA_TIMEOUT_SECONDS:-15}
      CHROMA_TOKEN: ${CHROMA_TOKEN:-}
    volumes:
      - ./uploads:/app/uploads
      - ./documents:/app/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
